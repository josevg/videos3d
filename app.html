<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- BIBLIOTECAS OBRIGATÓRIAS DO FFMPEG (Para o renderer.js funcionar) -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

  <title>Painel do Cliente - Vídeos 3D</title>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col">
  <nav class="p-4 border-b border-slate-800 flex justify-between items-center max-w-6xl mx-auto w-full">
    <h1 class="font-bold text-xl text-amber-400">Gerador de Vídeos 3D</h1>
    <button onclick="terminarSessao()" class="text-red-400 hover:underline text-sm">Terminar Sessão</button>
  </nav>

  <main class="flex-1 max-w-3xl mx-auto p-6 w-full space-y-6">
    <div id="avisoBloqueio" class="hidden bg-red-900/50 border border-red-500 p-4 rounded-lg text-red-200 text-center font-bold">
      ⚠️ A sua assinatura expirou! Renove o seu plano para continuar a gerar vídeos.
    </div>

    <!-- 🌟 PAINEL DE CONFIGURAÇÃO DA API GEMINI 🌟 -->
    <div class="bg-slate-800 p-6 rounded-xl border border-amber-500/50 space-y-4 shadow-lg shadow-amber-500/10">
      <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">
        🔑 Configuração da API Gemini
      </h2>
      <div>
        <label class="block text-sm mb-1 text-slate-300">Insira a(s) sua(s) Chave(s) de API:</label>
        <input id="inputApiKey" type="password" placeholder="Ex: AIzaSy..., AIzaSy..." class="w-full p-3 rounded bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
        <p class="text-xs text-slate-400 mt-2">* Se tiver várias chaves, separe-as por vírgula. Elas serão salvas apenas no seu navegador.</p>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="salvarChavesAPI()" class="bg-amber-500 text-black px-6 py-2 rounded-lg font-bold hover:bg-amber-400 transition">Salvar Chave</button>
        <span id="msgSalvo" class="text-emerald-400 text-sm font-bold hidden">✅ Chave salva com sucesso!</span>
      </div>
    </div>

    <!-- PAINEL DO GERADOR -->
    <div id="painelGerador" class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
      <h2 class="text-2xl font-bold">Criar Novo Vídeo</h2>
      <div>
        <label class="block text-sm mb-1 text-slate-300">Tema ou Roteiro:</label>
        <input id="inputTema" type="text" placeholder="Ex: Curiosidades sobre a Idade Média" class="w-full p-3 rounded bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
      </div>
      <button onclick="gerarVideo()" class="w-full bg-emerald-500 text-black p-3 rounded-lg font-bold hover:bg-emerald-400 transition">Gerar Vídeo no Navegador</button>
    </div>

    <div id="statusProcesso" class="text-center text-slate-400 text-sm font-semibold"></div>
  </main>

  <!-- PONTE AUTOMÁTICA COM O GITHUB -->
  <script src="https://cdn.jsdelivr.net/gh/josevg/videos3d@main/src/js/supabase/client.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/josevg/videos3d@main/src/js/gemini/rotator.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/josevg/videos3d@main/src/js/ffmpeg/renderer.js"></script>

  <script>
    // 1. Carrega a chave API e valida a sessão quando a página abre
    window.addEventListener('DOMContentLoaded', async () => {
      // Carrega a chave salva no input
      const savedKeys = localStorage.getItem('gemini_api_keys');
      if (savedKeys) {
        try {
          const keysArray = JSON.parse(savedKeys);
          document.getElementById('inputApiKey').value = keysArray.join(', ');
        } catch(e) {
          console.error("Erro ao ler chaves salvas", e);
        }
      }

      // Valida o acesso do cliente (Supabase)
      const cliente = await verificarAcessoDoUtilizador();
      if (!cliente) {
        document.getElementById('avisoBloqueio').classList.remove('hidden');
        document.getElementById('painelGerador').classList.add('opacity-50', 'pointer-events-none');
      }
    });

    // 2. Salva as chaves no navegador
    function salvarChavesAPI() {
      const inputVal = document.getElementById('inputApiKey').value;
      const keysArray = inputVal.split(',').map(k => k.trim()).filter(k => k !== '');
      
      if (keysArray.length === 0) {
        alert('Por favor, insira pelo menos uma chave válida.');
        return;
      }
      
      localStorage.setItem('gemini_api_keys', JSON.stringify(keysArray));
      
      const msg = document.getElementById('msgSalvo');
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 3000);
    }

    // 3. Gera o vídeo
    async function gerarVideo() {
      const tema = document.getElementById('inputTema').value;
      const statusDiv = document.getElementById('statusProcesso');

      if (!tema) return alert('Por favor, insira um tema!');
      if (!localStorage.getItem('gemini_api_keys')) {
        return alert('Por favor, configure e salve a sua chave API do Gemini primeiro!');
      }

      statusDiv.innerText = '🔄 A contactar a API do Gemini para criar o roteiro...';

      try {
        const prompt = `Crie um roteiro detalhado para vídeo 3D sobre: ${tema}`;
        const roteiro = await gerarTextoComGemini(prompt);
        
        console.log("Roteiro gerado:", roteiro); 

        statusDiv.innerText = '🎬 Roteiro obtido! A preparar ficheiros para o FFmpeg...';

        // ====================================================================
        // ⚠️ ATENÇÃO: AQUI É ONDE FALTA O SEU CÓDIGO DE RENDERIZAÇÃO 3D E ÁUDIO ⚠️
        // O renderer.js exige um arquivo de vídeo (videoBlob) e um de áudio (audioBlob).
        // Como você ainda não me enviou o código que gera o 3D e a voz, 
        // criei blobs falsos de teste para provar que o FFmpeg funciona. 
        // Substitua os blobs abaixo pela sua lógica real de geração.
        // ====================================================================
        
        // Simulação de Blob de Vídeo (Você deve substituir pelo seu Canvas/3D)
        const videoBlob = new Blob([], { type: 'video/webm' }); 
        
        // Simulação de Blob de Áudio (Você deve substituir pelo seu TTS/Voz)
        const audioBlob = new Blob([], { type: 'audio/wav' }); 

        statusDiv.innerText = '⚙️ Iniciando o motor FFmpeg...';

        // Chama a sua função do renderer.js
        await renderizarVideoFinal(videoBlob, audioBlob);

      } catch (erro) {
        console.error(erro);
        statusDiv.innerText = `❌ Erro: ${erro.message}`;
      }
    }

    async function terminarSessao() {
      await supabase.auth.signOut();
      window.location.href = '?page=vendas';
    }
  </script>
</body>
</html>
