<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Painel Admin - Vídeos 3D</title>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold text-red-400">Painel Administrativo</h1>
      <a href="?page=app" class="text-slate-400 hover:underline text-sm">Voltar ao App</a>
    </div>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
      <h2 class="text-xl font-bold">Atualizar Data de Vencimento de Cliente</h2>
      <div>
        <label class="block text-sm mb-1 text-slate-300">E-mail do Cliente:</label>
        <input id="adminEmail" type="email" placeholder="cliente@email.com" class="w-full p-3 rounded bg-slate-900 border border-slate-700 text-white">
      </div>
      <div>
        <label class="block text-sm mb-1 text-slate-300">Nova Data de Vencimento:</label>
        <input id="adminNovaData" type="date" class="w-full p-3 rounded bg-slate-900 border border-slate-700 text-white">
      </div>
      <button onclick="atualizarVencimento()" class="bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-500 transition">Atualizar Assinatura</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "SUA_URL_DO_SUPABASE";
    const SUPABASE_KEY = "SUA_CHAVE_ANON_DO_SUPABASE";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function atualizarVencimento() {
      const email = document.getElementById('adminEmail').value;
      const novaData = document.getElementById('adminNovaData').value;

      if (!email || !novaData) return alert('Preencha todos os campos!');

      const { data, error } = await supabase
        .from('clientes')
        .update({ data_vencimento: new Date(novaData).toISOString(), status: 'ativo' })
        .eq('email', email);

      if (error) {
        alert('Erro ao atualizar: ' + error.message);
      } else {
        alert('Assinatura atualizada com sucesso!');
        document.getElementById('adminEmail').value = '';
        document.getElementById('adminNovaData').value = '';
      }
    }
  </script>
</body>
</html>
