<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Criar Conta - Vídeos 3D</title>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">
  <div class="bg-slate-800 p-8 rounded-xl shadow-xl w-full max-w-md space-y-6 border border-slate-700">
    <h2 class="text-2xl font-bold text-center text-amber-400">Criar Nova Conta</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm mb-1 text-slate-300">E-mail</label>
        <input type="email" id="email" class="w-full p-3 rounded bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-amber-400" placeholder="seu@email.com">
      </div>
      <div>
        <label class="block text-sm mb-1 text-slate-300">Palavra-passe</label>
        <input type="password" id="password" class="w-full p-3 rounded bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-amber-400" placeholder="••••••••">
      </div>
      <button onclick="criarConta()" class="w-full bg-emerald-500 text-black p-3 rounded-lg font-bold hover:bg-emerald-400 transition">Registar</button>
    </div>
    <div class="text-center text-sm text-slate-400">
      Já tem conta? <a href="?page=login" class="text-amber-400 hover:underline">Entrar</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/josevg/videos3d@main/src/js/supabase/client.js"></script>
  <script>
    async function criarConta() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) return alert('Por favor, preencha todos os campos.');

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        alert('Erro ao registar: ' + error.message);
      } else {
        alert('Conta criada com sucesso! Faça login para aceder.');
        window.location.href = '?page=login';
      }
    }
  </script>
</body>
</html>
